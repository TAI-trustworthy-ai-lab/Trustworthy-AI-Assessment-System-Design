<!DOCTYPE html>
<html>
<!--這邊是調整網頁相關參數的地方 例如編碼阿、網頁名稱之類的阿-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--製作一個登入注冊框框-->
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background-color: #f4f4f9; }
        .container { background-color: white; border: 1px solid #e0e0e0; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 350px; margin: 10px; }
        h2 { text-align: center; color: #333; }
        input, button { display: block; width: 100%; margin: 15px 0; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; transition: background-color 0.3s; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .tab-buttons { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .tab-button { flex-grow: 1; text-align: center; padding: 10px; border: 1px solid #ccc; cursor: pointer; background-color: #f0f0f0; }
        .tab-button.active { background-color: #007bff; color: white; border-bottom: none; }
        #message { text-align: center; margin-top: 20px; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<!--這邊是決定網頁畫面的地方-->
<body>

    <div class="container">
        <div class="tab-buttons">
            <div class="tab-button active" id="loginTab">登入</div>
            <div class="tab-button" id="signupTab">註冊</div>
        </div>
        
        <div id="loginFormContainer">
            <h2>使用者登入</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="信箱" required>
                <input type="password" id="loginPassword" placeholder="密碼" required>
                <button type="submit">登入</button>
            </form>
        </div>

        <div id="signupFormContainer" class="hidden">
            <h2>使用者註冊</h2>
            <form id="signupForm">
                <input type="text" id="username" placeholder="使用者名稱" required>
                <input type="email" id="signupEmail" placeholder="信箱" required>
                <input type="password" id="signupPassword" placeholder="密碼" required>
                <button type="submit">註冊</button>
            </form>
        </div>
        
        <p id="message"></p>
    </div>

    <script>
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginFormContainer = document.getElementById('loginFormContainer');
        const signupFormContainer = document.getElementById('signupFormContainer');

        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const messageDisplay = document.getElementById('message');

        // 切換表單
        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginFormContainer.classList.remove('hidden');
            signupFormContainer.classList.add('hidden');
            messageDisplay.textContent = ''; // 清空訊息
        });

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupFormContainer.classList.remove('hidden');
            loginFormContainer.classList.add('hidden');
            messageDisplay.textContent = ''; // 清空訊息
        });

        // ******** 後端處理 ********** //
        // api函數使用： http://localhost:3001/api-docs

        // 注冊邏輯
        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
  
            const apiUrl = 'http://localhost:3001/api/user/signup';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();
                // ************ 成功過一次，之後放什麽random名字都是：message: "User with this name already exists"
                // ************ 不知道是前端還是後端問題；待查後端資料庫

                if (response.ok) {
                    messageDisplay.textContent = '註冊成功！請登入。';
                    messageDisplay.style.color = 'green';
                } else {
                    console.log('後端回傳的失敗資料：', data); // 除錯用
                    messageDisplay.textContent = data.message || '註冊失敗，請重試。';
                    messageDisplay.style.color = 'red';
                }

            } catch (error) {
                console.error('發生錯誤:', error);
                messageDisplay.textContent = '網路請求失敗，請檢查網路連線。';
                messageDisplay.style.color = 'red';
            }
        });

        // 登入邏輯
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const apiUrl = 'http://localhost:3001/api/user/login';

            try {
                const response = await fetch(apiUrl, {
                    method: 'GET', // 後端文件顯示登入是 GET 方法
                    headers: { 'Content-Type': 'application/json' },
                    // GET 請求的參數通常加在網址上，但有些後端也會用 body
                    // 這裡的後端文件沒有說明，先假設是 GET，但通常登入會是 POST
                    // 你可能需要與後端再次確認
                    
                    // ************ 無法使用！讓後端改成POST試試看：
                    /*
                        TypeError: Failed to execute 'fetch' on 'Window': Request with GET/HEAD method cannot have body.
                        at HTMLFormElement.<anonymous> (login.html:126:40)
                    */
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDisplay.textContent = '登入成功！';
                    messageDisplay.style.color = 'green';
                    // 這裡通常會將 token 存入 localStorage
                } else {
                    messageDisplay.textContent = data.message || '登入失敗，請檢查帳號密碼。';
                    messageDisplay.style.color = 'red';
                }
            } catch (error) {
                console.error('發生錯誤:', error);
                messageDisplay.textContent = '網路請求失敗，請檢查網路連線。';
                messageDisplay.style.color = 'red';
            }
        });
    </script>

</body>
</html>
