<!DOCTYPE html>
<html>
<!--這邊是調整網頁相關參數的地方 例如編碼阿、網頁名稱之類的阿-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<!--這邊是決定網頁畫面的地方-->
<body>
    <!--網頁上方的欄位 裝有兩個按鈕-->
    <div class="top-bar">
        <div class="ans-question">
            <p>填寫問卷</p>
        </div>
        <div class="view-result">
            <p>檢視結果</p>
        </div>
    </div>
    <!--按鈕樣式、動畫-->
    <style>
        .top-bar {
            display: flex;
            height: 50px;
            align-items: center;
            justify-content: center;
        }

        .ans-question {
            display: flex;
            width: 150px;
            align-items: center;
            justify-content: center;
        }

        .view-result {
            display: flex;
            width: 150px;
            align-items: center;
            justify-content: center;
        }

        .ans-question:hover {
            background-color: beige;
        }

        .ans-question:active {
            background-color: rgb(232, 232, 208);
        }

        .view-result:hover {
            background-color: beige;
        }

        .view-result:active {
            background-color: rgb(232, 232, 208);
        }

        .ans-question p {
            user-select: none;
        }

        .view-result p {
            user-select: none;
        }
    </style>
    <!--問卷架構-->
    <div class="Questionnaire-framework">
        <!--問卷的模板，要改動問卷結構請從這邊改(因為問題都是根據模板生成的)-->
        <div class="question-block-template" type="text/x-handlebars-template">
            <div class="question-block" style="{{styleTag}}">
                <p class="question-discription">{{question_content}}</p>
                <div class="level-choices" id="{{number}}">
                    <p>Disagree</p>
                    <div class="level" id="level_1" onclick="option(this)">
                        <div class="level-fill"></div>
                    </div>
                    <div class="level" id="level_2" onclick="option(this)">
                        <div class="level-fill"></div>
                    </div>
                    <div class="level" id="level_3" onclick="option(this)">
                        <div class="level-fill"></div>
                    </div>
                    <div class="level" id="level_4" onclick="option(this)">
                        <div class="level-fill"></div>
                    </div>
                    <div class="level" id="level_5" onclick="option(this)">
                        <div class="level-fill"></div>
                    </div>
                    <p>Agree</p>
                </div>
                <style>
                    .question-block {
                        display: none;
                        align-content: center;
                        justify-content: space-around;
                        height: 150px;
                        flex-direction: column;
                    }

                    .question-discription {
                        display: flex;
                        height: 5vh;
                    }

                    .level-choices {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        height: 100px;
                        column-gap: 1vh;
                    }

                    .level {
                        display: flex;
                        width: 5vh;
                        height: 5vh;
                        border-radius: 50%;
                        border: 2px solid aqua;
                        justify-content: center;
                        align-items: center;
                    }

                    .level-fill {
                        display: none;
                        width: 4.5vh;
                        height: 4.5vh;
                        border-radius: 50%;
                        background-color: aqua;
                    }
                </style>
            </div>
        </div>
        <!--裝生出來的問題的地方(容器)-->
        <div class="question-container">

        </div>
        <!--容器的樣式-->
        <style>
            .question-container {
                display: flex;
                align-items: center;
                flex-direction: column;
                row-gap: 25px;
            }
        </style>
        <!--寫模板生成、選項切換的JavaScript-->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
        <script>

            const source = document.querySelector(".question-block-template").innerHTML;

            const template = Handlebars.compile(source);

            let question_numbers = 3;
            let question_result = new Array(question_numbers);
            const question_contents = ["Question 1 : Who am I ? ", "Question 2 : Where am I ? ", "Question 3 : >w< ? "];

            question_result.fill(0);

            for (let i = 0; i < question_numbers; i++) {
                let data = { styleTag: "display:flex;", number: `question_${i + 1}`, question_content: `${question_contents[i]}` };
                const html = template(data);
                document.querySelector('.question-container').innerHTML += html;
            }
            function option(div) {
                levelArr = div.parentNode.querySelectorAll(".level");
                let index = parseInt(div.parentNode.id.split("_")[1]);
                for (let j = 0; j < levelArr.length; j++) {
                    if (levelArr[j].id == div.id) {
                        levelArr[j].querySelector(".level-fill").style.display = "flex";
                        question_result[index - 1] = j + 1;
                        continue;
                    }
                    levelArr[j].querySelector(".level-fill").style.display = "none";
                }
            }

        </script>
        <!--sumbit按鈕設計-->
        <div class="sumbit_block">
            <div class="sumbit_btn" onclick="sumbit_function()">
                <p>Sumbit</p>
            </div>
        </div>
        <!--按鈕樣式、動畫-->
        <style>
            .sumbit_block {
                display: flex;
                height: 50px;
                align-items: center;
                justify-content: center;
            }

            .sumbit_btn {
                display: flex;
                width: 150px;
                align-items: center;
                justify-content: center;
            }

                .sumbit_btn:hover {
                    background-color: beige;
                }

                .sumbit_btn:active {
                    background-color: rgb(232, 232, 208);
                }

                .sumbit_btn p {
                    user-select: none;
                }
        </style>
        <!--sumbit按鈕的功能-->
        <script>
            function sumbit_function() {
                alert(`問卷的答案依次為 ${question_result} 之後會傳回後端現在只是先alert出來`);
            }
        </script>
    </div>
</body>
</html>
